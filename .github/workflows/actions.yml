name: Deploy
on:
  push:
    branches:
      - deployment
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build -- --pathPrefix="/stac-browser/" --historyMode=hash --allowExternalAccess=true
      # - run: npm run build -- --pathPrefix="/stac-browser-freva/" --historyMode=hash --allowExternalAccess=true
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          exclude_assets: 'report.html'
          user_name: 'STAC Browser CI'
          user_email: m.hadizade1991y@gmail.com
